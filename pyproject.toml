[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpcms-dedup"
version = "0.1.0"
description = "RPCMS Duplicate Guard: cross-partner duplicate-assistance check and assistance ledger"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "pydantic>=2.5",
  "pydantic-settings>=2.2",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
test = ["pytest>=8", "httpx>=0.27"]

[tool.hatch.build.targets.wheel]
packages = ["src/rpcms_dedup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
